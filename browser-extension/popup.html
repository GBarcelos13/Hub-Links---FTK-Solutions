<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HUB Links</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>

  <!-- ── TELA DE LOGIN ─────────────────────────────── -->
  <div id="screen-login" class="screen">
    <div class="brand">
      <svg width="28" height="28" viewBox="0 0 32 32" fill="none">
        <rect width="32" height="32" rx="7" fill="#0F172A"/>
        <line x1="16" y1="16" x2="7"  y2="7"  stroke="#F59E0B" stroke-width="1.4" stroke-linecap="round" opacity=".6"/>
        <line x1="16" y1="16" x2="25" y2="7"  stroke="#F59E0B" stroke-width="1.4" stroke-linecap="round" opacity=".6"/>
        <line x1="16" y1="16" x2="7"  y2="25" stroke="#F59E0B" stroke-width="1.4" stroke-linecap="round" opacity=".6"/>
        <line x1="16" y1="16" x2="25" y2="25" stroke="#F59E0B" stroke-width="1.4" stroke-linecap="round" opacity=".6"/>
        <circle cx="16" cy="16" r="4"  fill="#F59E0B"/>
        <circle cx="7"  cy="7"  r="2.5" fill="#F59E0B" opacity=".85"/>
        <circle cx="25" cy="7"  r="2.5" fill="#F59E0B" opacity=".85"/>
        <circle cx="7"  cy="25" r="2.5" fill="#F59E0B" opacity=".85"/>
        <circle cx="25" cy="25" r="2.5" fill="#F59E0B" opacity=".85"/>
      </svg>
      <span>HUB Links</span>
    </div>

    <p class="subtitle">Entre para salvar links</p>

    <form id="form-login">
      <div class="field">
        <label for="email">E-mail</label>
        <input id="email" type="email" placeholder="seu@email.com" autocomplete="email" required />
      </div>
      <div class="field">
        <label for="password">Senha</label>
        <input id="password" type="password" placeholder="••••••••" autocomplete="current-password" required />
      </div>
      <div id="login-error" class="error-msg hidden"></div>
      <button type="submit" id="btn-login" class="btn-primary">
        <span class="btn-text">Entrar</span>
        <span class="btn-spinner hidden">⏳</span>
      </button>
    </form>
  </div>

  <!-- ── TELA DE SALVAR LINK ───────────────────────── -->
  <div id="screen-save" class="screen hidden">
    <div class="save-header">
      <div class="brand">
        <svg width="22" height="22" viewBox="0 0 32 32" fill="none">
          <rect width="32" height="32" rx="7" fill="#0F172A"/>
          <line x1="16" y1="16" x2="7"  y2="7"  stroke="#F59E0B" stroke-width="1.4" stroke-linecap="round" opacity=".6"/>
          <line x1="16" y1="16" x2="25" y2="7"  stroke="#F59E0B" stroke-width="1.4" stroke-linecap="round" opacity=".6"/>
          <line x1="16" y1="16" x2="7"  y2="25" stroke="#F59E0B" stroke-width="1.4" stroke-linecap="round" opacity=".6"/>
          <line x1="16" y1="16" x2="25" y2="25" stroke="#F59E0B" stroke-width="1.4" stroke-linecap="round" opacity=".6"/>
          <circle cx="16" cy="16" r="4"  fill="#F59E0B"/>
          <circle cx="7"  cy="7"  r="2.5" fill="#F59E0B" opacity=".85"/>
          <circle cx="25" cy="7"  r="2.5" fill="#F59E0B" opacity=".85"/>
          <circle cx="7"  cy="25" r="2.5" fill="#F59E0B" opacity=".85"/>
          <circle cx="25" cy="25" r="2.5" fill="#F59E0B" opacity=".85"/>
        </svg>
        <span>HUB Links</span>
      </div>
      <button id="btn-logout" class="btn-ghost" title="Sair">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
          <polyline points="16 17 21 12 16 7"/>
          <line x1="21" y1="12" x2="9" y2="12"/>
        </svg>
      </button>
    </div>

    <form id="form-save">
      <div class="field">
        <label for="link-name">Nome</label>
        <input id="link-name" type="text" maxlength="100" placeholder="Nome do link" required />
      </div>
      <div class="field">
        <label for="link-url">URL</label>
        <input id="link-url" type="url" placeholder="https://..." required />
      </div>
      <div class="field">
        <label for="link-desc">Descrição <span class="optional">(opcional)</span></label>
        <input id="link-desc" type="text" maxlength="200" placeholder="Breve descrição..." />
      </div>
      <div id="save-error" class="error-msg hidden"></div>
      <button type="submit" id="btn-save" class="btn-primary">
        <span class="btn-text">Salvar no HUB</span>
        <span class="btn-spinner hidden">⏳</span>
      </button>
    </form>
  </div>

  <!-- ── TELA DE SUCESSO ───────────────────────────── -->
  <div id="screen-success" class="screen hidden">
    <div class="success-content">
      <div class="success-icon">✓</div>
      <p class="success-title">Link salvo!</p>
      <p class="success-sub" id="success-name"></p>
      <button id="btn-another" class="btn-outline">Salvar outro</button>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
