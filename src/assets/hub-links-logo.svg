<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 40" fill="none">
  <!-- Mark: five interconnected nodes in a hub pattern -->
  <!-- Connection lines first (behind nodes) -->
  <line x1="20" y1="20" x2="8"  y2="9"  stroke="#F59E0B" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>
  <line x1="20" y1="20" x2="32" y2="9"  stroke="#F59E0B" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>
  <line x1="20" y1="20" x2="8"  y2="31" stroke="#F59E0B" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>
  <line x1="20" y1="20" x2="32" y2="31" stroke="#F59E0B" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>
  <!-- Center hub node -->
  <circle cx="20" cy="20" r="5.5" fill="#F59E0B"/>
  <!-- Satellite nodes -->
  <circle cx="8"  cy="9"  r="3.5" fill="#F59E0B" opacity="0.75"/>
  <circle cx="32" cy="9"  r="3.5" fill="#F59E0B" opacity="0.75"/>
  <circle cx="8"  cy="31" r="3.5" fill="#F59E0B" opacity="0.5"/>
  <circle cx="32" cy="31" r="3.5" fill="#F59E0B" opacity="0.5"/>
  <!-- Wordmark -->
  <text x="46" y="27" font-family="'Syne', 'DM Sans', system-ui, sans-serif" font-size="20" font-weight="800" fill="currentColor" letter-spacing="-0.8">hub</text>
  <text x="88" y="27" font-family="'Syne', 'DM Sans', system-ui, sans-serif" font-size="20" font-weight="400" fill="#F59E0B" letter-spacing="-0.3">links</text>
</svg>
