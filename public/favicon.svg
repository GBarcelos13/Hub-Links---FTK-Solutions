<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Background -->
  <rect width="32" height="32" rx="7" fill="#0F172A"/>
  <!-- Connection lines (behind nodes) -->
  <line x1="16" y1="16" x2="7"  y2="7"  stroke="#F59E0B" stroke-width="1.4" stroke-linecap="round" opacity="0.6"/>
  <line x1="16" y1="16" x2="25" y2="7"  stroke="#F59E0B" stroke-width="1.4" stroke-linecap="round" opacity="0.6"/>
  <line x1="16" y1="16" x2="7"  y2="25" stroke="#F59E0B" stroke-width="1.4" stroke-linecap="round" opacity="0.4"/>
  <line x1="16" y1="16" x2="25" y2="25" stroke="#F59E0B" stroke-width="1.4" stroke-linecap="round" opacity="0.4"/>
  <!-- Center hub node -->
  <circle cx="16" cy="16" r="5" fill="#F59E0B"/>
  <!-- Satellite nodes -->
  <circle cx="7"  cy="7"  r="3" fill="#F59E0B" opacity="0.85"/>
  <circle cx="25" cy="7"  r="3" fill="#F59E0B" opacity="0.85"/>
  <circle cx="7"  cy="25" r="3" fill="#F59E0B" opacity="0.5"/>
  <circle cx="25" cy="25" r="3" fill="#F59E0B" opacity="0.5"/>
</svg>
